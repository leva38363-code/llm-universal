[package]
name = "llm-universal"
version = "0.4.0-beta.1"
edition = "2021"
rust-version = "1.85"
license = "MIT-0"
readme = "README.md"
keywords = ["llm", "openai", "anthropic", "gemini", "ai"]
categories = ["api-bindings", "web-programming::http-client", "asynchronous"]
include = ["src/**/*.rs", "examples/**/*.rs", "tests/**/*.rs", "README.md", "CHANGELOG.md", "LICENSE", "Cargo.toml"]
repository = "https://github.com/leva38363-code/llm-universal"

[dependencies]
async-trait = "0.1"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hmac = "0.12"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["time"] }

[features]
fuzzing = []

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
